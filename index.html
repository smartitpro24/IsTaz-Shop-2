<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Website Updated</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
    }

    .container {
        text-align: center;
        background: rgba(255,255,255,0.1);
        padding: 40px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        max-width: 400px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    p {
        font-size: 16px;
        margin-bottom: 25px;
        opacity: 0.9;
    }

    .btn {
        display: inline-block;
        padding: 12px 25px;
        background: #ffcc00;
        color: #000;
        font-weight: bold;
        text-decoration: none;
        border-radius: 30px;
        transition: 0.3s;
    }

    .btn:hover {
        background: #fff;
        color: #333;
    }

    .note {
        font-size: 13px;
        margin-top: 15px;
        opacity: 0.7;
    }
</style>

</head>

<body>

<div class="container">
    <h1>🚀 Website Updated</h1>
    
    <p>
        Sorry! This website link has been updated.<br>
        Please click the button below to visit the new website.
    </p>

    <!-- 👉 এখানে তোমার নতুন লিঙ্ক বসাও -->
    <a href="https://smartitpro24.github.io/IsTaz-Shop" class="btn">
        Go to New Website
    </a>

    <div class="note">
        You will be redirected to the updated version.
    </div>
</div>

</body>
</html>
